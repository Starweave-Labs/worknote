name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npm --prefix server audit --omit=dev --audit-level=high
      - run: npm --prefix client audit --audit-level=high
      - name: Validate an initialized empty data root
        run: |
          npm run init -- --no-env
          npm run record -- check --json
        env:
          WORKNOTE_ENV_FILE: ""
          WORKNOTE_ROOT: ${{ runner.temp }}/worknote-ci-empty
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t worknote:ci .
